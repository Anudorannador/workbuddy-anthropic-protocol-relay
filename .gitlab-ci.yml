stages:
  - verify
  - test

default:
  image: node:22-alpine
  # Pin every job to the dedicated runner so a shared/instance runner with
  # different tooling can never pick these up.
  tags:
    - linux
    - node
    - docker
  cache:
    key: "$CI_COMMIT_REF_SLUG"
    paths:
      - .npm/

variables:
  npm_config_cache: "$CI_PROJECT_DIR/.npm"

syntax:
  stage: verify
  script:
    - node --version
    - for f in $(find src bin test -name '*.mjs'); do node --check "$f"; done
    - echo "all modules parse"

unit:
  stage: test
  script:
    - npm test
  artifacts:
    when: always
    expire_in: 1 week
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

audit:
  stage: test
  script:
    - npm audit --audit-level=high || true
  allow_failure: true
